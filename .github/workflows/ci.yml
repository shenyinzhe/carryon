# Tests + container images.
#   push / PR: run tests, build and smoke-test the image natively on amd64 and arm64
#   tag vX.Y.Z (must equal config.yaml version): also push to ghcr.io
#     <owner>/{amd64,aarch64}-carryon:X.Y.Z   per-arch, for the Home Assistant add-on
#     <owner>/carryon:X.Y.Z, :latest          multi-arch, for plain Docker
name: CI
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r carryon/requirements.txt pytest
      - run: pytest -q

  image:
    needs: test
    strategy:
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: v
        run: |
          v=$(sed -n 's/^version: *"\(.*\)"/\1/p' carryon/config.yaml)
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF_NAME#v}" != "$v" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match config.yaml version $v"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Build
        run: >
          docker build -t carryon:ci
          --label org.opencontainers.image.source=https://github.com/${{ github.repository }}
          --label org.opencontainers.image.version=${{ steps.v.outputs.version }}
          --label org.opencontainers.image.licenses=MIT
          carryon
      - name: Smoke test
        run: |
          secret=$(python3 -c "import secrets; print(secrets.token_urlsafe(32))")
          docker run -d --name carryon -p 8765:8765 -e CARRYON_SECRET="$secret" carryon:ci
          init='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}'
          post() { curl -s -o /dev/null -w '%{http_code}' -X POST -d "$init" \
            -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
            "http://127.0.0.1:8765/$1/mcp" || true; }
          for i in $(seq 30); do [ "$(post "$secret")" = 200 ] && break; sleep 1; done
          docker logs carryon
          [ "$(post "$secret")" = 200 ] || { echo "::error::MCP endpoint not up"; exit 1; }
          [ "$(post wrong)" = 404 ] || { echo "::error::wrong path not rejected"; exit 1; }
          ! docker logs carryon 2>&1 | grep -qF "$secret" || { echo "::error::secret leaked to log"; exit 1; }
      - name: Push
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          img=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.arch }}-carryon:${{ steps.v.outputs.version }}
          docker tag carryon:ci "$img"
          docker push "$img"

  manifest:
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Multi-arch tag for plain Docker
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          r=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}
          v=${GITHUB_REF_NAME#v}
          docker buildx imagetools create -t "$r/carryon:$v" -t "$r/carryon:latest" \
            "$r/amd64-carryon:$v" "$r/aarch64-carryon:$v"
